<!DOCTYPE html>
<html lang="en" class="min-h-screen">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Marcelas B&B Restaurant | Kitchen</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/tokens.css">
    <link rel="stylesheet" href="assets/app.css">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/tailwind.compiled.css">
</head>

<body class="kds min-h-screen flex flex-col antialiased selection:bg-brand-accent selection:text-brand-dark">

    <header class="glass-panel sticky top-0 z-50 border-b border-brand-border/60 no-print">
        <div class="max-w-7xl w-full mx-auto px-4 py-2">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-utensils text-brand-accent text-2xl mr-2"></i>
                <h1 class="text-lg sm:text-xl font-bold tracking-tight text-brand-cream font-serif whitespace-nowrap">Marcelas Kitchen</h1>
            </div>
            <p class="text-brand-muted text-xs mt-1">
                <span class="rounded-full w-3 h-3 bg-brand-accent" id="modedot" aria-label="live feed mode">●</span>
                <span class="ml-2" id="modelabel">connecting</span> ·
                <span class="font-mono text-brand-accentLight" id="clock">--:--:--</span>
            </p>
        </div>
    </header>

    <main id="app" class="max-w-7xl w-full mx-auto px-4 flex-1"></main>

    <footer class="glass-panel border-t border-brand-border/60 mt-auto py-3 px-4 no-print">
        <p class="text-brand-muted text-xs">
            <i class="fa-solid fa-utensils text-brand-accent mr-1"></i>
            Marcelas B&B Restaurant · Kitchen · signed in as <span id="staffid" class="font-mono text-brand-cream">nobody</span>
        </p>
    </footer>

<script>
    /* --- config bootstrap: force storeSlug to marcelas ------------------- */
    (function () {
        const q = new URLSearchParams(location.search);
        const url = q.get('sburl'), key = q.get('sbkey');
        let cfg;
        try { cfg = JSON.parse(localStorage.getItem('sl_config') || '{}'); } catch { cfg = {}; }
        cfg.storeSlug = 'marcelas';  // FORCE marcelas store
        if (url) cfg.sbUrl = url;
        if (key) cfg.sbKey = key;
        localStorage.setItem('sl_config', JSON.stringify(cfg));
    })();
</script>

<script type="module">
    import { signIn, setSessionToken, kitchenQueue, markServed, setPreparing, fmtTime, fmtCountdown, staffSession } from './assets/api.js';
    import { startWatching, stopWatching, mode as realtimeMode } from './assets/realtime.js';

    let rows = [];
    let boardError = null;
    let toast = null;
    let staffEmail = null;
    let storeId = null;
    let watching = false;

    const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

    const GATE_COPY = "Staff sign-in required — sign in through the Marcelas login page.";
    const AUTH_COPY = "That staff account wasn't accepted. Check the credentials.";
    const SERVED_COPY = "Marked as served — card leaves the board.";
    const HOLD_COPY = "On hold — card stays on the board.";
    const WRONG_STORE = "This station belongs to a different store — you are not authorized.";
    const ERR_COPY = {
        ORDER_EXPIRED: "This order's time is up, please place a new one",
        NOT_SERVABLE: "That order isn't waiting in the kitchen any more — it's already done.",
        NOT_PREPARABLE: "That order is already on hold, no need to hold it again.",
        ORDER_NOT_FOUND: "That card isn't on the board right now.",
        NETWORK: "We can't reach Marcelas right now. Check your connection and try again.",
        HTTP: "The Marcelas server had trouble with that request. Try again, and if it keeps happening let the manager know.",
    };

    const pad = (n) => String(n).padStart(2, '0');
    const clockEl = document.getElementById('clock');
    function tick() {
        const d = new Date();
        clockEl.textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }
    tick();
    setInterval(tick, 1000);

    function elapsedSeconds(paidAt) {
        const t = Date.parse(String(paidAt ?? ''));
        if (Number.isNaN(t)) return 0;
        return Math.max(0, Math.floor((Date.now() - t) / 1000));
    }

    function renderAuthGate(copy) {
        document.getElementById('app').innerHTML =
            `<div class="glass-card rounded-xl p-6 text-center my-6">
               <p class="text-brand-accentLight text-sm font-semibold">${copy}</p>
               <p class="text-brand-muted text-xs mt-2">Nothing on this board loads until a staff session exists — orders are invisible to anonymous visitors.</p>
             </div>`;
    }

    function renderCard(r) {
        const code = String(r.code ?? '');
        const secs = elapsedSeconds(r.paid_at);
        const holding = String(r.status ?? '') === 'preparing';
        const cups = (r.items || []).reduce((n, it) => n + Number(it.quantity ?? 1), 0);
        const items = (r.items || []).map((it) => {
            const qty = Number(it.quantity ?? 1);
            const size = String(it.size ?? '');
            return `<li class="text-brand-cream text-sm py-1">
                      <span class="font-mono text-brand-accentLight text-2xl mr-2">${qty}×</span>
                      <span class="text-lg whitespace-nowrap">${esc(it.item_name ?? '')}</span>
                      ${size ? `<span class="text-brand-muted ml-1 text-xs uppercase tracking-wider">${esc(size)}</span>` : ''}
                    </li>`;
        }).join('');
        const holdBtn = holding
            ? ''
            : `<button class="rounded-lg whitespace-nowrap text-xs min-h-[48px] px-3 py-2 mt-2 bg-brand-card/60 border border-brand-border text-brand-cream" data-hold>Hold</button>`;
        return `<div class="glass-card rounded-xl p-5 my-4" data-order-card data-order-id="${esc(r.order_id ?? '')}" data-code="${esc(code)}">
                <div class="flex items-baseline space-between gap-4 flex-wrap">
                  <p class="text-brand-cream text-2xl font-serif whitespace-nowrap">${esc(r.customer_name ?? '')}</p>
                  <span class="font-mono text-brand-accentLight text-2xl whitespace-nowrap">${cups} cups</span>
                  <span class="rounded-md px-2 py-1 bg-brand-card border border-brand-border/60 font-mono text-brand-accentLight text-xs tracking-widest whitespace-nowrap" style="letter-spacing:0.3em">${esc(code)}</span>
                </div>
                <div class="flex items-center gap-3 mt-2 flex-wrap">
                  <span class="text-brand-muted text-xs uppercase tracking-wider">Paid ${fmtTime(r.paid_at)}</span>
                  <span class="font-mono text-brand-accentLight text-2xl whitespace-nowrap">${fmtCountdown(secs)}</span>
                  ${holding ? `<span class="status-lastcall rounded-md px-2 py-1 whitespace-nowrap">ON HOLD</span>` : ''}
                </div>
                <ul class="list-none mt-3">${items || '<li class="text-brand-muted text-sm">No line items in the payload.</li>'}</ul>
                <button class="btn-primary rounded-xl whitespace-nowrap text-sm mt-3" data-served>Mark as Served</button>
                ${holdBtn}
              </div>`;
    }

    function renderBoard() {
        const body = rows.map(renderCard).join('');
        const empty = `<div class="glass-card rounded-xl p-5 my-4 text-center">
                       <p class="text-brand-muted text-sm">Nothing waiting in the kitchen.</p>
                     </div>`;
        const note = boardError
            ? `<p class="text-brand-accentLight text-xs mt-2">[${boardError}] ${ERR_COPY[boardError] ?? ERR_COPY.HTTP}</p>`
            : '';
        return `${body || empty}${note}`;
    }

    function renderToast() {
        if (!toast || Date.now() >= toast.until) return '';
        return `<div class="glass-card rounded-xl p-3 my-3 text-center">
                <p class="text-brand-accentLight text-sm font-semibold">${toast.msg}</p>
              </div>`;
    }

    function paint() {
        document.getElementById('app').innerHTML = renderToast() + renderBoard();
    }

    async function refreshQueue() {
        const res = await kitchenQueue();
        if (!res.success) { boardError = res.error?.code ?? 'HTTP'; return; }
        boardError = null;
        rows = res.data || [];
        rows.sort((a, b) => String(a.paid_at ?? '').localeCompare(String(b.paid_at ?? '')));
        paint();
    }

    async function handleServed(orderId) {
        const res = await markServed(orderId);
        if (!res.success) { boardError = res.error?.code ?? 'HTTP'; paint(); return; }
        toast = { msg: SERVED_COPY, until: Date.now() + 2000 };
        paint();
        setTimeout(() => refreshQueue(), 500);
    }

    async function handleHold(orderId) {
        const res = await setPreparing(orderId);
        if (!res.success) { boardError = res.error?.code ?? 'HTTP'; paint(); return; }
        toast = { msg: HOLD_COPY, until: Date.now() + 2000 };
        paint();
        setTimeout(() => refreshQueue(), 500);
    }

    document.addEventListener('click', (e) => {
        const t = e.target;
        if (t.dataset.served !== undefined) {
            const card = t.closest('[data-order-card]');
            if (card) handleServed(card.dataset.orderId);
        }
        if (t.dataset.hold !== undefined) {
            const card = t.closest('[data-order-card]');
            if (card) handleHold(card.dataset.orderId);
        }
    });

    /* --- boot: sign in first ----------------------------------------------- */
    (async function () {
        let saved = null;
        try { saved = JSON.parse(localStorage.getItem('sl_auth') || 'null'); } catch { saved = null; }
        if (!saved || !saved.email || !saved.password) { renderAuthGate(GATE_COPY); return; }

        const res = await signIn(saved.email, saved.password);
        if (!res.success) { renderAuthGate(AUTH_COPY); return; }
        setSessionToken(res.data.access_token);

        const ss = await staffSession();
        if (!ss.success) { renderAuthGate(GATE_COPY); return; }
        const data = ss.data || {};
        staffEmail = data.email;
        storeId = data.store_id;
        document.getElementById('staffid').textContent = staffEmail;

        // STORE ISOLATION: verify this staff belongs to marcelas
        if (storeId !== '00000000-0000-0000-8333-000000000002') {
            renderAuthGate(WRONG_STORE);
            return;
        }

        /* Start realtime watching with store filter ------------------------- */
        if (storeId) {
            startWatching(
                () => refreshQueue(),
                refreshQueue,
                storeId  // filter realtime events to this store only
            );
            watching = true;
        }

        /* Initial queue read ------------------------------------------------ */
        await refreshQueue();

        /* Update mode dot from realtime.js ---------------------------------- */
        setInterval(() => {
            const m = realtimeMode;
            const dot = document.getElementById('modedot');
            const label = document.getElementById('modelabel');
            if (m === 'ws') { dot.className = 'rounded-full w-3 h-3 bg-green-500'; label.textContent = 'live'; }
            else if (m === 'poll') { dot.className = 'rounded-full w-3 h-3 bg-brand-accent'; label.textContent = 'polling'; }
            else { dot.className = 'rounded-full w-3 h-3 bg-red-500'; label.textContent = 'disconnected'; }
        }, 1000);
    })();
</script>
</body>
</html>
