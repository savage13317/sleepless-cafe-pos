<!DOCTYPE html>
<html lang="en" class="min-h-screen">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Staff surface: unlisted AND unindexed (Gate B). No other POS page links
         here, and nothing here links to menu / kitchen / owner. -->
    <meta name="robots" content="noindex">
    <title>Sleepless Cafe | Cashier</title>

    <!-- Tailwind utilities: compiled CSS (Phase B build; loads below, after app.css, to match the CDN's runtime injection order) -->
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter & Playfair Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <!-- Brand tokens are the ONLY place colors are defined. This link MUST stay
         above app.css below, because app.css consumes the :root custom
         properties out of the resolved stylesheet. -->
    <link rel="stylesheet" href="assets/tokens.css">
    <link rel="stylesheet" href="assets/app.css">

    <!-- Favicon: with no icon declared, every page load requests /favicon.ico and
         GitHub Pages answers 404 — a dead request on every visit. SVG only, self-contained. -->
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

    <!-- Tailwind utilities, compiled at build time from tools/tailwind.config.js, which READS assets/tokens.css — tokens.css stays the single source of truth; regenerate the artifact (node ./node_modules/tailwindcss/lib/cli.js build -i tools/tailwind.src.css -o assets/tailwind.compiled.css -c tools/tailwind.config.js -m) whenever a token changes. Loaded HERE (after tokens.css + app.css) because the CDN injected its generated stylesheet at runtime, after every head link — same cascade. -->
    <link rel="stylesheet" href="assets/tailwind.compiled.css">
</head>

<body class="min-h-screen flex flex-col antialiased selection:bg-brand-accent selection:text-brand-dark">

    <!-- STICKY GLASS HEADER: wordmark + live clock (HH:MM:SS, 1s tick). -->
    <header class="glass-panel sticky top-0 z-50 border-b border-brand-border/60 no-print">
        <div class="max-w-7xl w-full mx-auto px-4 py-2">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-cash-register text-brand-accent text-2xl mr-2"></i>
                <h1 class="text-lg sm:text-xl font-bold tracking-tight text-brand-cream font-serif whitespace-nowrap">Cashier</h1>
            </div>
            <p class="text-brand-muted text-xs mt-1">
                Counter terminal · <span class="font-mono text-brand-accentLight" id="clock">--:--:--</span>
            </p>
        </div>
    </header>

    <!-- Code field lives OUTSIDE #app so repainting the board never destroys the
         field the cashier is typing into. -->
    <div id="codefield" class="max-w-7xl w-full mx-auto px-4"></div>

    <main id="app" class="max-w-7xl w-full mx-auto px-4 flex-1"></main>

    <!-- VOID ACTION — DELIBERATELY OMITTED (by design, not by missing data).
         listActivePending() DOES hand back order_id (sql/02_functions.sql), so a
         Void button could be wired here — it isn't, because void_order is a
         manager decision, not a cashier one. What the cashier MAY write is its
         own claim: confirm_payment, plus the pre-payment edits set_claim_item_qty
         and add_claim_item (sql/02_functions.sql), which reprice the claim the
         cashier just looked up. Those edits stop at the payment boundary — this
         page never voids, marks served, or touches a claim that is already paid.
         The owner dashboard owns voiding. Nothing here calls voidOrder, and no
         id is ever invented here: the id comes from the board row or claim_view.
         The one edit deliberately refused is dropping the last line of a claim
         (LAST_LINE_ONLY) — an empty claim is a void, which is the owner's call. -->

    <footer class="glass-panel border-t border-brand-border/60 mt-auto py-3 px-4 no-print">
        <p class="text-brand-muted text-xs">
            <i class="fa-solid fa-cash-register text-brand-accent mr-1"></i>
            Sleepless Cafe · Cashier · signed in as <span id="staffid" class="font-mono text-brand-cream">nobody</span> · prices in Philippine peso (₱)
        </p>
    </footer>

    <!-- ========================= CASHIER APP (ES module) =====================
     Imports from './assets/api.js' (folder prefix required — this page sits at
     repo root); api.js imports config.js
     itself, so config.js is not imported here. Orders are RLS-denied to anon, so this page signs in
     first and hands the access token to setSessionToken. The password is never
     rendered, logged, or echoed anywhere — only the signed-in email is shown.
     ====================================================================== -->
<!-- ============================ CONFIG BOOTSTRAP (classic) ===================
     Classic (non-module) on purpose: a page's module body runs AFTER its
     imported modules, so a bootstrap inside the module body would execute
     after config.js already resolved CONFIG from localStorage. Values are
     never printed or echoed.                                                    -->
<script>
    /* --- config bootstrap (Phase A): persist ?sburl= / ?sbkey= once -------
       Classic (non-module) on purpose: must run before config.js is evaluated.
       Values are never printed or echoed. */
    (function () {
        const q = new URLSearchParams(location.search);
        const url = q.get('sburl'), key = q.get('sbkey');
        if (!url && !key) return;
        let cfg;
        try { cfg = JSON.parse(localStorage.getItem('sl_config') || '{}'); } catch { cfg = {}; }
        if (url) cfg.sbUrl = url;
        if (key) cfg.sbKey = key;
        localStorage.setItem('sl_config', JSON.stringify(cfg));
    })();
</script>

<script type="module">
    import { signIn, setSessionToken, clearSessionToken, staffSession, getOrderByCode, listActivePending, confirmPayment, getMenu,
            getClaimView, setClaimItemQty, addClaimItem, fmtPeso, fmtTime, fmtCountdown } from './assets/api.js';

    /* --- state ----------------------------------------------------------- */
    let rows = [];              // live unpaid claims from listActivePending()
    let lookup = null;          // {kind, ...} — current code-lookup view
    let toast = null;           // {msg, until} — transient success line
    let boardError = null;      // error code from the last board poll
    let staffEmail = null;      // email of the signed-in staff session
    let staffName = null;       // roster display_name of that session — what the board shows
    let lastTap = Date.now();   // last interaction; IDLE_MS of none = auto sign-out
    let signedOut = false;      // logged out (manually or by idle): board stays closed
    const IDLE_MS = 3 * 60 * 60 * 1000;   // three hours, the owner's rule
    let menu = [];              // available catalogue, for the Add-to-claim panel
    /* One claim is edited at a time. A double tap on + or Remove would otherwise
       fire two edits, and the second would be applied to a line the first edit
       may already have moved - the same glitch that put two orders through from
       the customer cart. */
    let claimBusy = false;
    let claimNote = null;       // last refused claim edit, shown on the card

    /* Codes are STRINGS end-to-end: leading zeros are significant, so a code is
       never passed through Number(). */
    const CODE_RE = /^[0-9]{5}$/;

    const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

    /* --- error copy: one human line per code, never a stack trace, never the
         raw code string. ORDER_EXPIRED wording is contractual, verbatim. */
    const GATE_COPY = "Staff sign-in required — add ?email=&password= to this URL once.";
    const AUTH_COPY = "That staff account wasn't accepted. Check the credentials in the URL — nothing was stored.";
    const BAD_SHAPE = "That's not a 5-digit code.";
    const NOT_FOUND = "Wrong code, or that order's time is up.";
    const PAID_COPY = "Paid — sent to the kitchen.";
    /* --- identity + logout copy (owner complaint: no name, no log-out) ----- */
    const WHO_COPY = (name) => `Signed in as ${name} — tap Log out to close the register.`;
    const LOGGED_OUT_COPY = "Signed out. The register is closed — sign in again from the staff door.";
    const IDLE_COPY = "Three hours with no taps at this register, so you were signed out. Sign in again from the staff door.";
    const NOT_ON_ROSTER = "This email is signed in but not on the staff roster — the register stays closed.";
    const NOT_CASHIER = "This staff member doesn't stand at the register — the cashier board stays closed.";
    const ERR_COPY = {
        ORDER_EXPIRED: "This order's time is up, please place a new one",
        NOT_VOIDABLE: "That claim isn't open any more — it's already paid or gone.",
        ORDER_NOT_FOUND: NOT_FOUND,
        CLAIM_NOT_OPEN: "That claim isn't open any more — look the code up again before changing it.",
        LINE_NOT_FOUND: "That line isn't on the claim any more — the board was refreshed.",
        INVALID_QTY: "That quantity doesn't work — between 1 and 999, or Remove to drop the line.",
        LAST_LINE_ONLY: "That's the only line left, so it can't be removed — void the claim instead of ordering nothing.",
        NETWORK: "We can't reach the cafe right now. Check your connection and try again.",
        HTTP: "The cafe server had trouble with that request. Try again, and if it keeps happening let the barista know.",
    };

    /* --- live clock: HH:MM:SS on a 1s tick ------------------------------- */
    const pad = (n) => String(n).padStart(2, '0');
    const clockEl = document.getElementById('clock');
    function tick() {
        const d = new Date();
        clockEl.textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }
    tick();
    setInterval(tick, 1000);

    /* --- sign out: bearer gone, saved credentials gone, board closed ------
       clearSessionToken() drops the bearer realtime/api calls use; removing
       sl_auth is what makes the sign-out SURVIVE a refresh — otherwise a reload
       would boot straight back in from localStorage and the cashier would never
       actually be out. login.html is the only place credentials get typed again. */
    function signOut(copy) {
        signedOut = true;
        clearSessionToken();
        try { localStorage.removeItem('sl_auth'); } catch { /* private mode */ }
        staffEmail = null;
        staffName = null;
        document.getElementById('staffid').textContent = 'nobody';
        renderAuthGate(copy);
    }

    /* --- auth gate card (no session = no board) -------------------------- */
    function renderAuthGate(copy) {
        document.getElementById('app').innerHTML =
            `<div class="glass-card rounded-xl p-6 text-center my-6">
               <p class="text-brand-accentLight text-sm font-semibold">${copy}</p>
               <p class="text-brand-muted text-xs mt-2">Nothing on this board loads until a staff session exists — orders are invisible to anonymous visitors.</p>
             </div>`;
    }

    /* --- board rows ------------------------------------------------------ */
    function renderRow(r) {
        const code = String(r.code ?? '');
        const secs = Math.max(0, Math.floor(Number(r.seconds_remaining) || 0));
        /* < 2 min left: the next click may already be past the deadline, so the
           row wears the semantic status pair from assets/app.css and the cell
           says LAST CALL before the countdown. */
        const last = secs < 120;
        const timeCell = last
            ? `<span class="status-lastcall rounded-md px-2 py-1 whitespace-nowrap">LAST CALL ${fmtCountdown(secs)}</span>`
            : `<span class="status-live rounded-md px-2 py-1 whitespace-nowrap">${fmtCountdown(secs)}</span>`;
        return `<tr class="border-b border-brand-border/40${last ? ' status-lastcall' : ''}" data-code="${esc(code)}">
                <td class="font-mono text-brand-cream tracking-widest py-2 px-3 whitespace-nowrap">${esc(code)}</td>
                <td class="text-brand-cream py-2 px-3">${esc(r.customer_name ?? '')}</td>
                <td class="font-mono text-brand-muted py-2 px-3 whitespace-nowrap">${fmtTime(r.created_at)}</td>
                <td class="py-2 px-3 whitespace-nowrap">${timeCell}</td>
                <td class="font-mono text-center py-2 px-3">${Number(r.items_count ?? 0)}</td>
                <td class="font-mono text-brand-accentLight text-right py-2 px-3 whitespace-nowrap">${fmtPeso(r.total_amount)}</td>
              </tr>`;
    }

    /* the register shows WHO is standing at it, so a shared terminal can never
       be edited by the wrong pair of hands — display_name from sql/07, never
       the email, never the credential. */
    function whoLine() {
        if (!staffName) return '';
        return `<p class="text-brand-accentLight text-xs mt-2">${esc(WHO_COPY(staffName))}</p>`;
    }

    function renderBoard() {
        const head = `<tr class="bg-brand-card/60 text-brand-muted text-xs uppercase tracking-wider py-2">
                <th class="px-3 text-left">Code</th>
                <th class="px-3 text-left">Customer Name</th>
                <th class="px-3 text-left">Time Created</th>
                <th class="px-3 text-left">Time Remaining</th>
                <th class="px-3 text-center">No. of Items/Drinks</th>
                <th class="px-3 text-right">Total Amount</th>
              </tr>`;
        const body = rows.map(renderRow).join('');
        const empty = `<tr><td class="text-brand-muted text-sm py-3 px-3 text-center" colspan="6">No unpaid claims on the board right now.</td></tr>`;
        const note = boardError
            ? `<p class="text-brand-accentLight text-xs mt-2">${ERR_COPY[boardError] ?? ERR_COPY.HTTP}</p>`
            : '';
        /* A counter terminal can read about ten claims at a glance, so past that
           the board scrolls inside its own card (assets/app.css .board-scroll)
           instead of turning the page into a hundred-row column. The note only
           appears when there IS more to scroll to. */
        const scrollNote = rows.length > 10
            ? `<p class="text-brand-muted text-xs mt-2">All ${rows.length} unpaid claims are listed — scroll the board to reach the ones past the first screen.</p>`
            : '';
        return `<div class="glass-card rounded-xl p-4 mt-4 overflow-x-auto">
                <div class="board-scroll">
                  <table class="w-full border-collapse">
                    <tbody>${head}${body || empty}</tbody>
                  </table>
                </div>
                ${scrollNote}
                ${note}
                ${whoLine()}
              </div>`;
    }

    /* --- lookup views ---------------------------------------------------- */
    /* THE CLAIM CARD IS THE CUSTOMER CART, re-dressed for the counter: it uses
       the same .cart-line grid from assets/app.css, so a cashier reads a claim
       exactly the way a customer read their own order - name, amount, −,
       quantity, +, Remove. Two identities make the edits possible: the card
       carries order_id and each line carries the order_items row id, which is
       the only stable handle for addressing ONE line (item_name + size is not,
       since a claim can hold the same item twice under different sizes).
       Every number on the card is the server's: an edit repaints from the
       claim_view envelope the SQL returns, which carries the recomputed total,
       so the counter never prices a line itself. */
    function renderClaimLine(r) {
        return `<div class="cart-line py-1 border-b border-brand-border/40"
                    data-claim-line data-claim-item="${esc(r.item_id)}" data-claim-qty="${esc(r.quantity ?? 0)}">
                    <span class="text-brand-cream text-sm">${esc(r.item_name ?? '')} · ${esc(r.size ?? '')}</span>
                    <span class="cart-price text-brand-accentLight font-mono text-sm">${fmtPeso(r.subtotal)}</span>
                    <button class="cart-btn rounded-lg text-sm font-bold" data-claim-qty="-1">−</button>
                    <span class="cart-qty text-brand-cream font-mono text-sm">${Number(r.quantity ?? 0)}</span>
                    <button class="cart-btn rounded-lg text-sm font-bold" data-claim-qty="1">+</button>
                    <button class="cart-btn cart-btn-remove rounded-lg text-xs font-bold" data-claim-remove><i class="fa-solid fa-trash mr-1"></i>Remove</button>
                  </div>`;
    }

    /* Add to this claim: the counter can put something on a claim that the
       customer forgot. Only available catalogue items are offered here, and
       nothing on this page prices them - add_claim_item pulls unit_price out
       of menu_items itself, so a stale panel can name a size but never invent
       an amount. */
    function renderAddPanel() {
        if (!menu.length) {
            return `<p class="text-brand-muted text-xs mt-2">The menu could not be loaded on this terminal, so this claim can be adjusted but not added to.</p>`;
        }
        const chips = menu.map((m) => {
            const sizes = (m.sizes_and_prices ?? []).map((s) =>
                `<button class="size-chip rounded-md text-xs" data-claim-add data-claim-menu="${esc(m.id)}" data-claim-size="${esc(s.size)}">${esc(s.size)}</button>`).join('');
            if (!sizes) return '';
            return `<div class="flex items-center gap-2 flex-wrap my-1">
                    <span class="text-brand-cream text-sm whitespace-nowrap">${esc(m.name)}</span>
                    <span class="flex gap-2 flex-wrap">${sizes}</span>
                  </div>`;
        }).join('');
        return `<div class="rounded-lg p-3 bg-brand-card/40 border border-brand-border/40 mt-3">
                <p class="text-brand-accent text-xs uppercase tracking-wider mb-2">Add to this claim — tap a size</p>
                ${chips}
              </div>`;
    }

    function renderFound() {
        const l = lookup;
        const secs = Math.max(0, Math.floor(Number(l.seconds_remaining) || 0));
        const status = secs < 120 ? 'status-lastcall' : 'status-live';
        const lines = (l.items ?? []).map(renderClaimLine).join('');
        const note = claimNote
            ? `<p class="text-brand-accentLight text-xs mt-2">${ERR_COPY[claimNote] ?? ERR_COPY.HTTP}</p>`
            : '';
        return `<div class="glass-card rounded-xl p-6 my-4"
                    data-order-card data-code="${esc(l.code)}" data-order-id="${esc(l.order_id)}">
                <p class="text-brand-accent text-xs uppercase tracking-wider mb-2">Claim on the board</p>
                <div class="font-mono text-brand-accentLight text-4xl tracking-widest" style="letter-spacing:0.3em">${esc(l.code)}</div>
                <p class="text-brand-cream text-lg font-serif mt-2">${esc(l.name)}</p>
                <div class="flex items-center gap-3 mt-3 flex-wrap">
                  <span class="text-brand-muted text-xs uppercase tracking-wider">Created ${fmtTime(l.created_at)}</span>
                  <span class="${status} rounded-md px-2 py-1 whitespace-nowrap">${fmtCountdown(l.seconds_remaining)}</span>
                  <span class="text-brand-muted text-xs uppercase tracking-wider">${Number(l.items_count ?? 0)} item${Number(l.items_count ?? 0) === 1 ? '' : 's'}</span>
                  <span class="font-mono text-brand-accentLight">${fmtPeso(l.total_amount)}</span>
                </div>
                ${note}
                <p class="text-brand-accent text-xs uppercase tracking-wider mt-4">On this claim · tap − or + beside the number, Remove to drop a line</p>
                ${lines}
                ${renderAddPanel()}
                <button class="btn-primary rounded-xl whitespace-nowrap text-sm mt-3" data-confirm>Confirm Payment</button>
              </div>`;
    }

    function renderLookup() {
        if (!lookup) return '';
        if (lookup.kind === 'found') return renderFound();
        const copy = lookup.kind === 'badshape' ? BAD_SHAPE
                   : lookup.kind === 'notfound' ? NOT_FOUND
                   : ERR_COPY[lookup.copy] ?? ERR_COPY.HTTP;
        /* Wrong code and expired claim share one copy on purpose — the server
           cannot tell them apart either, and this page must not hint which. */
        return `<div class="glass-card rounded-xl p-4 my-4">
                <p class="text-brand-accentLight text-sm font-semibold">${copy}</p>
              </div>`;
    }

    function renderToast() {
        if (!toast || Date.now() >= toast.until) return '';
        return `<div class="glass-card rounded-xl p-3 my-3 text-center">
                <p class="text-brand-accentLight text-sm font-semibold">${toast.msg}</p>
              </div>`;
    }

    function paint() {
        document.getElementById('app').innerHTML = renderLookup() + renderToast() + renderBoard();
    }

    /* --- board refresh: listActivePending() purges expired rows server-side,
         so a claim that hit 30 minutes simply stops being returned and its row
         disappears with no ghost left behind. ---------------------------- */
    async function refreshBoard() {
        const res = await listActivePending();
        if (!res.success) { boardError = res.error?.code ?? 'HTTP'; return; }
        boardError = null;
        /* The order is the SERVER's, not ours. list_active_pending returns claims
           A-Z by customer name (newest first within a name), and re-sorting here
           used to overwrite that with newest-first — so the board jumped around
           every time a claim was placed. Keep whatever the server handed back. */
        rows = (res.data || []).filter((r) => Number(r.seconds_remaining) > 0);
    }

    /* --- code lookup: shape-checked client-side, so a mistyped scan never
         reaches the server. --------------------------------------------- */
    async function lookupCode(raw) {
        const code = String(raw ?? '').trim();
        if (!CODE_RE.test(code)) {
            lookup = { kind: 'badshape' };
            return paint();
        }
        const res = await getOrderByCode(code);
        if (!res.success) {
            lookup = { kind: 'error', copy: res.error?.code ?? 'HTTP' };
            if (res.error?.code === 'ORDER_NOT_FOUND') lookup = { kind: 'notfound' };
            return paint();
        }
        const d = res.data || {};
        lookup = claimFromView(d, d.order_id ?? '');
        claimNote = null;
        paint();
    }

    /* --- claim edits + payment ------------------------------------------- */
    /* claim_view is the single shape get_order_by_code, set_claim_item_qty and
       add_claim_item all return, so one builder turns any of them into the
       card's state. items[] carries the order_items row ids the lines address
       themselves by. */
    function claimFromView(d, orderId) {
        return {
            kind: 'found',
            order_id: String(d.order_id ?? orderId ?? ''),
            code: String(d.code ?? ''),
            name: d.customer_name ?? '',
            created_at: d.created_at,
            seconds_remaining: d.seconds_remaining,
            items_count: d.items_count,
            total_amount: d.total_amount,
            items: d.items ?? [],
        };
    }

    /* An edit repaints from SERVER truth, never from what the tap intended:
       set_claim_item_qty and add_claim_item both hand back the whole claim with
       the total recomputed, so the card and the board row can never disagree. */
    async function applyClaim(orderId, res) {
        if (!res.success) {
            claimNote = res.error?.code ?? 'HTTP';   /* claim untouched, say why */
        } else {
            const d = res.data || {};
            if (!d.order_id) { claimNote = 'CLAIM_NOT_OPEN'; }
            else { lookup = claimFromView(d, orderId); claimNote = null; }
        }
        await refreshBoard();
        paint();
    }

    async function editClaimQty(orderId, itemId, quantity) {
        if (claimBusy || !orderId || !itemId) return;
        claimBusy = true;
        const res = await setClaimItemQty(orderId, itemId, quantity);
        claimBusy = false;
        await applyClaim(orderId, res);
    }
    async function addClaimLine(orderId, menuItemId, size) {
        if (claimBusy || !orderId || !menuItemId || !size) return;
        claimBusy = true;
        const res = await addClaimItem(orderId, menuItemId, size, 1);
        claimBusy = false;
        await applyClaim(orderId, res);
    }

    /* --- payment: on success the row must already be gone when we repaint,
         so the board is re-read before painting. ------------------------ */
    async function pay(code) {
        /* One confirm per tap: a double tap must not fire a second confirm,
           which would put the same claim through to the kitchen twice. */
        if (claimBusy) return;
        claimBusy = true;
        const res = await confirmPayment(code);
        claimBusy = false;
        if (res.success) {
            lookup = null;
            toast = { msg: PAID_COPY, until: Date.now() + 6000 };
        } else {
            lookup = { kind: 'error', copy: res.error?.code ?? 'HTTP' };
        }
        await refreshBoard();
        paint();
    }

    /* --- event wiring (delegated, so repainting cards keeps handlers) ---- */
    document.addEventListener('click', (e) => {
        const t = e.target;
        /* any tap at the register counts as being there, which is what resets
           the idle clock — the board polling itself must never do that, or a
           cashier asleep in front of a live board would never be signed out. */
        lastTap = Date.now();
        if (t.dataset.logout !== undefined) {
            if (signedOut) return;
            void signOut(LOGGED_OUT_COPY);
            return;
        }
        if (t.dataset.confirm !== undefined) {
            const card = t.closest('[data-order-card]');
            if (card) void pay(card.dataset.code);
        }
        else if (t.dataset.lookup !== undefined) {
            const input = document.querySelector('[data-code-input]');
            void lookupCode(input ? input.value : '');
        }
        /* Claim edits. The line is addressed by its order_items row id, which
           the row itself carries, and the card carries order_id. The only thing
           computed here is the next quantity - the server re-validates it, so a
           stale DOM number can never write a wrong amount. */
        else if (t.dataset.claimQty !== undefined) {
            const card = t.closest('[data-order-card]');
            const line = t.closest('[data-claim-line]');
            if (card?.dataset.orderId && line?.dataset.claimItem) {
                void editClaimQty(card.dataset.orderId, line.dataset.claimItem,
                    Number(line.dataset.claimQty) + Number(t.dataset.claimQty));
            }
        }
        else if (t.dataset.claimRemove !== undefined) {
            const card = t.closest('[data-order-card]');
            const line = t.closest('[data-claim-line]');
            if (card?.dataset.orderId && line?.dataset.claimItem) {
                /* Remove is quantity 0: the SQL deletes the line, and refuses
                   only when it would leave the claim with nothing on it. */
                void editClaimQty(card.dataset.orderId, line.dataset.claimItem, 0);
            }
        }
        else if (t.dataset.claimAdd !== undefined) {
            const card = t.closest('[data-order-card]');
            if (card?.dataset.orderId && t.dataset.claimMenu && t.dataset.claimSize) {
                void addClaimLine(card.dataset.orderId, t.dataset.claimMenu, t.dataset.claimSize);
            }
        }
    });

    /* --- code input: big, monospace, typed or scanned -------------------- */
    function openCodeInput() {
        const host = document.getElementById('codefield');
        host.innerHTML =
            `<div class="glass-card rounded-xl p-4 my-4">
               <label class="text-brand-muted text-xs uppercase tracking-wider">Claim code — type or scan</label>
               <input type="text" placeholder="5-digit code" spellcheck="false" autocomplete="off"
                      class="font-mono text-3xl tracking-widest rounded-lg p-3 text-brand-cream bg-brand-card/60 border border-brand-border mt-2 w-full box-content"
                      data-code-input></div>
               <button class="btn-primary rounded-xl whitespace-nowrap text-sm mt-2" data-lookup>Look Up</button>
               <button class="rounded-lg px-3 py-2 text-xs min-h-[48px] bg-brand-card/60 border border-brand-border text-brand-cream whitespace-nowrap mt-2" data-logout>Log out</button>`;
        const input = host.querySelector('[data-code-input]');
        /* `change` on a bare input only fires on commit, so the Look Up button
           is the reliable path; the listener stays as a convenience. */
        input.addEventListener('change', () => void lookupCode(input.value));
    }

    /* --- boot: auth gate first, then clock-driven board polling every 5s -- */
    (async function () {
        const q = new URLSearchParams(location.search);
        let email = q.get('email'), password = q.get('password');
        if (!email || !password) {
            let saved = null;
            try { saved = JSON.parse(localStorage.getItem('sl_auth') || 'null'); } catch { saved = null; }
            if (saved && saved.email && saved.password) { email = saved.email; password = saved.password; }
        }
        if (!email || !password) { renderAuthGate(GATE_COPY); return; }

        const res = await signIn(email, password);
        if (!res.success) {
            renderAuthGate(res.error?.code === 'NETWORK' ? ERR_COPY.NETWORK : AUTH_COPY);
            return;
        }
        const d = res.data || {};
        setSessionToken(d.access_token);
        try { localStorage.setItem('sl_auth', JSON.stringify({ email, password })); } catch { /* private mode */ }
        staffEmail = d?.user?.email || email;
        /* only the email is surfaced — the password is never rendered */
        document.getElementById('staffid').textContent = staffEmail;

        /* WHO stands at the register: staff_session() reads the caller's claims
           against sql/07 staff_roster and refreshes last_seen_at server-side, so
           the roster's "seen" column and this board agree. The DISPLAY NAME is
           what the cashier needs to see (an email is not a name), and the role
           decides whether this board is even open — a kitchen cook must not run
           the register. */
        const ss = await staffSession();
        if (!ss.success) {
            const code = ss.error?.code;
            renderAuthGate(code === 'STAFF_NOT_REGISTERED' ? NOT_ON_ROSTER
                : code === 'WRONG_STATION' ? NOT_CASHIER
                : code === 'NETWORK' ? ERR_COPY.NETWORK : ERR_COPY.HTTP);
            return;
        }
        const me = ss.data || {};
        staffName = String(me.display_name ?? '') || staffEmail;
        document.getElementById('staffid').textContent = staffName;
        if (String(me.role ?? '') !== 'cashier') { renderAuthGate(NOT_CASHIER); return; }
        lastTap = Date.now();

        openCodeInput();
        /* The Add-to-claim panel needs the catalogue. menu_items carry a public
           READ policy (sql/03_rls.sql), so this read can never fail the board -
           a failed load only leaves the panel with a line saying so. */
        const cat = await getMenu();
        if (cat.success) menu = (cat.data || []).filter((m) => m.is_available === true);
        await refreshBoard();
        paint();
        /* the register's own heartbeat: refresh the board every 5 s, and on
           every beat ask whether three hours have passed with no tap at all.
           Idle is measured from the LAST TAP, never from the poll, so a cashier
           mid-service (tapping codes, editing claims) is never signed out, and
           one who walked off after their shift is. */
        setInterval(async () => {
            if (signedOut) return;
            if (Date.now() - lastTap >= IDLE_MS) { void signOut(IDLE_COPY); return; }
            await refreshBoard();
            paint();
        }, 5000);
    })();
    </script>
</body>
