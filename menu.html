<!DOCTYPE html>
<html lang="en" class="min-h-screen">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Public customer entry point: intentionally indexable (Gate B keeps noindex
         only on cashier / kitchen / owner). -->
    <meta name="description" content="Sleepless Cafe — browse the menu, build your order, and get your 5-digit claim code.">
    <title>Sleepless Cafe | Menu</title>

    <!-- Tailwind utilities: compiled CSS (Phase B build; loads below, after app.css, to match the CDN's runtime injection order) -->
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter & Playfair Display (flagship) + Cinzel & Plus Jakarta
         Sans (marcelas store theme, stores/marcelas/tokens.css). Flagship's two
         families stay exactly as they were. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700&family=Cinzel:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Brand tokens are the ONLY place colors are defined. This link MUST stay
         above app.css below, because app.css consumes the :root custom
         properties out of the resolved stylesheet. -->
    <link rel="stylesheet" href="assets/tokens.css">
    <link rel="stylesheet" href="assets/app.css">

    <!-- Favicon: with no icon declared, every page load requests /favicon.ico and
         GitHub Pages answers 404 — a dead request on every visit. SVG only, self-contained. -->
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

    <!-- Tailwind utilities, compiled at build time from tools/tailwind.config.js, which READS assets/tokens.css — tokens.css stays the single source of truth; regenerate the artifact (node ./node_modules/tailwindcss/lib/cli.js build -i tools/tailwind.src.css -o assets/tailwind.compiled.css -c tools/tailwind.config.js -m) whenever a token changes. Loaded HERE (after tokens.css + app.css) because the CDN injected its generated stylesheet at runtime, after every head link — same cascade. -->
    <link rel="stylesheet" href="assets/tailwind.compiled.css">

    <!-- Store theme for marcelas ONLY. Safe to load unconditionally: every rule
         in it is scoped to [data-sl-store="marcelas"], so on flagship it matches
         nothing and is a strict no-op. It sits AFTER the compiled artifact because
         that artifact has literal hex baked in and its brand-* utilities must be
         outscoped, not merely overridden by custom properties. -->
    <link rel="stylesheet" href="stores/marcelas/tokens.css">

    <!-- Theme hook, stamped as early as possible so a branch page never flashes
         flagship's palette. Classic (non-module) on purpose: it must run before
         any module is fetched/evaluated. Flagship keeps its own attribute value,
         which no store theme is scoped to, so flagship stays byte-identical. -->
    <script>
        (function () {
            var s = new URLSearchParams(location.search).get('store');
            document.documentElement.setAttribute('data-sl-store', s || 'flagship');
        })();
    </script>
</head>

<body class="min-h-screen flex flex-col antialiased selection:bg-brand-accent selection:text-brand-dark">

    <!-- STICKY GLASS HEADER: wordmark + browse line. Deliberately contains NO
         links to cashier / kitchen / owner — staff surfaces are unlisted here. -->
    <header class="glass-panel sticky top-0 z-50 border-b border-brand-border/60 no-print">
        <div class="max-w-5xl w-full mx-auto px-4 py-2">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-mug-hot text-brand-accent text-2xl mr-2"></i>
                <!-- data-branch-title: the resolveBranch() flow rewrites THIS element's
                     text for a non-flagship slug. The literal stays SLEEPLESS CAFE so
                     flagship renders byte-identically and there is no first-paint flash. -->
                <h1 data-branch-title class="text-lg sm:text-xl font-bold tracking-tight text-brand-cream font-serif whitespace-nowrap">SLEEPLESS CAFE</h1>
            </div>
            <p class="text-brand-muted text-xs mt-1">Browse the menu — tap a category to start.</p>
        </div>
    </header>

    <main id="app" class="max-w-5xl w-full mx-auto px-4 flex-1"></main>

    <!-- Name field lives OUTSIDE #app so re-rendering the menu never destroys
         it, and it sits ABOVE the cart on purpose: the customer writes their
         name before they look at the total, so the field is already filled by
         the time they tap Proceed to Checkout at the foot of the cart. -->
    <div id="namefield" class="max-w-5xl w-full mx-auto px-4"></div>

    <!-- The cart is its own block, below the name field. It is outside #app for
         the same reason the field is: paint() replaces #app's innerHTML, and a
         cart inside #app could not be repainted without being destroyed by the
         menu render. -->
    <div id="cartarea" class="max-w-5xl w-full mx-auto px-4"></div>

    <footer class="glass-panel border-t border-brand-border/60 mt-auto py-3 px-4 no-print">
        <p class="text-brand-muted text-xs">
            <i class="fa-solid fa-mug-hot text-brand-accent mr-1"></i>
            <span data-branch-name>Sleepless Cafe</span> · Prices in Philippine peso (₱)
        </p>
        <p class="text-brand-muted text-xs">
            © 2026 <span data-branch-name>Sleepless Cafe</span> · All rights reserved · Powered by CapFam, Ltd.
        </p>
    </footer>

    <!-- ============================ MENU APP (ES module) =======================
     Imports from './assets/api.js' (the folder prefix is required — this page
     sits at repo root, so a bare './api.js' would 404); api.js imports config.js
     itself, so config.js is not imported here.
     The config bootstrap lives in a CLASSIC script ABOVE this module: config.js
     resolves CONFIG at its own module-init time, which runs before this page's
     module body, so a bootstrap inside the module would arrive too late.
     ====================================================================== -->
<script>
    /* --- config bootstrap (Phase A): persist ?sburl= / ?sbkey= once -------
       Classic (non-module) on purpose: must run before config.js is evaluated.
       Values are never printed or echoed. */
    (function () {
        const q = new URLSearchParams(location.search);
        const url = q.get('sburl'), key = q.get('sbkey');
        if (!url && !key) return;
        let cfg;
        try { cfg = JSON.parse(localStorage.getItem('sl_config') || '{}'); } catch { cfg = {}; }
        if (url) cfg.sbUrl = url;
        if (key) cfg.sbKey = key;
        localStorage.setItem('sl_config', JSON.stringify(cfg));
    })();
</script>

<script type="module">
    import { resolveStore, menuForStore, categoriesForStore, createOrder, fmtPeso } from './assets/api.js';
    import { CONFIG } from './assets/config.js';

    /* --- state ----------------------------------------------------------- */
    let categories = [];            // [{id,name,display_order}]
    let menu = [];                  // raw rows
    let cart = new Map();           // key: menu_item_id + '\0' + size -> {itemId,size,qty}
    let activeCat = null;           // category id currently tabbed
    let orderResult = null;         // {code,name} once placed — success screen mode
    /* Selected size per item. NOT stored on the card element: paint() replaces
       #app's innerHTML, so a data-size written on a card is destroyed on the
       next repaint (Add to Cart, or tapping another category) and the customer's
       pick silently reverts to the first offered size. */
    const sizeChoice = new Map();   // menu_item_id -> size label

    const keyOf = (id, size) => id + '\u0000' + size;
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

    /* --- error copy: one human line per code, brand-accent-light on glass.
         The raw code string is never shown to the customer. */
    const ERR_COPY = {
        INVALID_CUSTOMER_NAME: "We need your name at the counter.",
        INVALID_ITEMS: "Your cart looks empty — add something before checking out.",
        MENU_ITEM_UNAVAILABLE: "One of those items just went away. We refreshed the menu, adjust your cart and try again.",
        INVALID_SIZE: "That size isn't on the board anymore. Pick another size and try again.",
        CODE_EXHAUSTED: "We're out of claim codes right now — please try again in a few minutes.",
        NETWORK: "We can't reach the cafe right now. Check your connection and try again.",
        HTTP: "The cafe server had trouble with that request. Try again, and if it keeps happening let the barista know.",
        STORE_NOT_FOUND: "That branch isn't open right now. Try another location, or check back later.",
    };

    /* --- store routing (Phase 9): resolve ?store= slug -> branch, cache ~60s --
       Default slug is CONFIG.storeSlug ('flagship'), so the existing single-branch
       public host works with no ?store= param. menu_for_store/categories_for_store
       are store-scoped and filter is_available server-side (rows carry no is_available). */
    let storeCtx = null;            // {slug, storeId, tier, name}
    const STORE_TTL_MS = 60000;

    async function resolveBranch() {
        const q = new URLSearchParams(location.search);
        const slug = q.get('store') || CONFIG.storeSlug || 'flagship';
        let cached = null;
        try { cached = JSON.parse(localStorage.getItem('sl_store') || 'null'); } catch { cached = null; }
        if (cached && cached.slug === slug && (Date.now() - (cached.ts || 0)) < STORE_TTL_MS) {
            storeCtx = { slug, storeId: cached.storeId, tier: cached.tier, name: cached.name };
            applyBranchTitle(slug, cached.name);
            return null;
        }
        const r = await resolveStore(slug);
        if (!r.success) return r;
        const d = r.data || {};
        storeCtx = { slug, storeId: d.id, tier: d.tier, name: d.name };
        localStorage.setItem('sl_store', JSON.stringify({ slug, storeId: d.id, tier: d.tier, name: d.name, ts: Date.now() }));
        applyBranchTitle(slug, d.name);
        return null;
    }

    /* --- branch wordmark ---------------------------------------------------
       Only a non-flagship slug touches the wordmark, so flagship's markup stays
       byte-identical. textContent, never innerHTML: the store name is DB data
       and must never be parsed as markup.
       ------------------------------------------------------------------- */
    function applyBranchTitle(slug, name) {
        if (slug === 'flagship') return;
        const label = String(name || slug).trim();
        if (!label) return;
        const h1 = document.querySelector('[data-branch-title]');
        if (h1) h1.textContent = label.toUpperCase();
        /* footer wordmarks take the name as-is, not uppercased */
        document.querySelectorAll('[data-branch-name]').forEach((el) => { el.textContent = label; });
    }

    /* --- load catalogue -------------------------------------------------- */
    async function loadCatalogue() {
        const rErr = await resolveBranch();
        if (rErr) return rErr;
        const [cRes, mRes] = await Promise.all([categoriesForStore(storeCtx.storeId), menuForStore(storeCtx.storeId)]);
        for (const r of [cRes, mRes]) {
            if (!r.success) return r;
        }
        categories = cRes.data || [];
        menu = (mRes.data || []).filter((m) => m.is_available !== false);
        return null;
    }

    const itemsIn = (catId) =>
        menu.filter((m) => m.category_id === catId);

    /* --- render: header + tab bar + item stack + cart -------------------- */
    function renderTabs() {
        const visible = categories.filter((c) => itemsIn(c.id).length > 0);
        if (!visible.length) return '';
        if (!visible.some((c) => c.id === activeCat)) activeCat = visible[0].id;
        const tabs = visible.map((c) => {
            const on = c.id === activeCat ? ' nav-btn active' : '';
            return `<button data-cat="${esc(c.id)}" class="rounded-lg px-3 py-2 text-sm font-semibold whitespace-nowrap${on}">${esc(c.name)}</button>`;
        }).join('');
        return `<div class="flex items-center gap-2 overflow-x-auto pb-2 mt-4"
                    style="scrollbar-width:thin">${tabs}</div>`;
    }

    function renderItems(catId) {
        return itemsIn(catId).map((m) => renderItem(m)).join('');
    }

    function renderItem(m) {
        const sizes = Array.isArray(m.sizes_and_prices) ? m.sizes_and_prices : [];
        const img = (m.image_url && String(m.image_url).trim())
            ? `<img src="${esc(m.image_url)}" alt="${esc(m.name)}" loading="lazy"
                 class="w-full h-40 object-cover rounded-xl mb-3">`
            /* seed data ships empty image_url: this glass tile with a fa-solid
               icon is the intentional placeholder, not a broken image. */
            : `<div class="glass-card rounded-xl h-40 mb-3 flex items-center justify-center">
                 <i class="fa-solid fa-coffee text-brand-accent text-5xl opacity-60"></i>
               </div>`;
        /* The first offered size is the default: it is what Add to Cart takes
           when the customer never taps a chip, so it must render as SELECTED —
           otherwise the choice is invisible and a phone customer orders the
           wrong size. State is never carried by color alone: the selected chip
           also gets a check icon and an aria-label. */
        const selSize = sizeChoice.get(m.id) ?? (sizes[0]?.size ?? '');
        const chips = sizes.map((s) => {
            const on = s.size === selSize;
            return `<button data-size="${esc(s.size)}"
               aria-label="${on ? 'Selected size' : 'Choose size'}: ${esc(s.size)}"
               class="size-chip${on ? ' selected' : ''} rounded-md px-2 py-1 text-xs font-semibold whitespace-nowrap">${on ? '<i class="fa-solid fa-check text-brand-accentLight mr-1"></i>' : ''}${esc(s.size)} · ${fmtPeso(s.price)}</button>`;
        }).join('');
        return `<div class="glass-card rounded-xl p-4 mb-4" data-item="${esc(m.id)}">
            ${img}
            <h3 class="text-brand-cream text-lg font-bold tracking-tight mt-2">${esc(m.name)}</h3>
            ${m.description ? `<p class="text-brand-muted text-sm mt-1">${esc(m.description)}</p>` : ''}
            <div class="flex items-center gap-2 flex-wrap mt-3">${chips}</div>
            <div class="flex items-center justify-between mt-3">
              <div class="flex items-center space-x-2">
                <button class="rounded-md px-2 py-1 text-sm font-bold text-brand-accentLight" data-qty="-1">−</button>
                <span class="font-mono text-brand-cream text-sm" data-qty-display>1</span>
                <button class="rounded-md px-2 py-1 text-sm font-bold text-brand-accentLight" data-qty="1">+</button>
              </div>
              <button class="btn-primary rounded-xl whitespace-nowrap text-xs ml-auto" data-add>Add to Cart</button>
            </div>
          </div>`;
    }

    function renderCart() {
        const rows = [...cart.values()];
        if (!rows.length) {
            return `<div class="glass-card rounded-xl p-4 text-center">
                <p class="text-brand-muted text-sm">Your cart is empty. Tap a card and Add to Cart.</p>
              </div>`;
        }
        let count = 0, total = 0;
        const lines = rows.map((r) => {
            const item = menu.find((m) => m.id === r.itemId);
            const price = (item?.sizes_and_prices ?? []).find((s) => s.size === r.size)?.price ?? 0;
            count += r.qty; total += price * r.qty;
            /* An item already in the cart can only be undone FROM the cart: the
               card stepper is clamped at 1 because it sets the quantity for the
               NEXT add. So every line carries its own controls, and the row
               carries the id+size identity the buttons need to find the entry. */
            /* cart-line, not flex: see assets/app.css. justify-between spread
               the leftover space between items, so the amount and the steppers
               drifted to a different x on every row. Grid columns line them up. */
            return `<div class="cart-line py-1 border-b border-brand-border/40"
                    data-cart-line data-cart-id="${esc(r.itemId)}" data-cart-size="${esc(r.size)}">
                <span class="text-brand-cream text-sm">${esc(item?.name ?? 'Item')} · ${esc(r.size)}</span>
                <span class="cart-price text-brand-accentLight font-mono text-sm">${fmtPeso(price * r.qty)}</span>
                <button class="cart-btn rounded-lg text-sm font-bold" data-cart-qty="-1">−</button>
                <span class="cart-qty text-brand-cream font-mono text-sm">${r.qty}</span>
                <button class="cart-btn rounded-lg text-sm font-bold" data-cart-qty="1">+</button>
                <button class="cart-btn cart-btn-remove rounded-lg text-xs font-bold" data-cart-remove><i class="fa-solid fa-trash mr-1"></i>Remove</button>
              </div>`;
        }).join('');
        return `<div class="glass-card rounded-xl p-4 mt-4">
            <p class="text-brand-accent text-xs uppercase tracking-wider mb-2">Your cart · ${count} item${count === 1 ? '' : 's'}</p>
            ${lines}
            <p class="text-brand-muted text-xs mt-1">The number between − and + is how many you have. Tap − or + to change it, Remove to drop the line.</p>
            <p class="text-brand-accentLight font-mono text-sm mt-2">Total ${fmtPeso(total)}</p>
            <button class="btn-primary rounded-xl whitespace-nowrap text-sm mt-3" data-checkout>Proceed to Checkout</button>
          </div>`;
    }

    /* --- main render ----------------------------------------------------- */
    /* Three blocks, in the order a customer reads them: the menu, the name
       field (ABOVE the cart), the cart. Each is its own element because paint()
       replaces innerHTML — an <input> inside #app would be destroyed on every
       repaint. renderError() is the copy only; whether the cart stays visible
       is paintError()'s decision, since the cart now lives in its own block. */
    function renderMenu() {
        return renderTabs() + renderItems(activeCat);
    }

    function renderError(res) {
        const copy = ERR_COPY[res.error?.code] ?? ERR_COPY.HTTP;
        return `<div class="glass-card rounded-xl p-4 my-4">
            <p class="text-brand-accentLight text-sm font-semibold">${copy}</p>
          </div>`;
    }

    /* --- success screen: code is a STRING, leading zeros preserved ------- */
    /* The window shown to the customer is the config value, never a literal —
       config.js ttlMinutes and the DB column default are changed as a pair. */
    function ttlMinutes() {
        const t = Number(CONFIG.ttlMinutes);
        return (Number.isFinite(t) && t > 0) ? t : 30;
    }

    function renderSuccess() {
        const code = String(orderResult.code);
        const name = esc(orderResult.name);
        return `<div class="glass-card rounded-xl p-6 text-center">
            <p class="text-brand-muted text-xs uppercase tracking-wider mb-3">Your claim code</p>
            <div class="font-mono text-brand-accentLight text-5xl sm:text-7xl font-bold tracking-widest my-2"
                 style="letter-spacing:0.35em">${esc(code)}</div>
            <p class="text-brand-cream text-lg font-serif mt-2">${name}</p>
            <p class="text-brand-accentLight text-sm mt-3 mx-auto max-w-prose text-center">
                Order Placed! Please present your code ${esc(code)} and your name (${name}) to the cashier within ${ttlMinutes()} minutes to process payment.
            </p>
            <p class="text-brand-muted text-xs mt-3">
                Keep this screen open until the cashier confirms — do not close or refresh this page.
            </p>
          </div>`;
    }

    /* --- checkout flow --------------------------------------------------- */
    /* A double tap on Proceed to Checkout used to place TWO identical orders:
       the cart was only emptied AFTER the await, so the second click still saw
       the same cart and fired a second create_order. Two guards now, and they
       are both synchronous - they run before anything is sent, which is the
       only place a second click can be seen. */
    let placing = false;

    async function checkout() {
        const rows = [...cart.values()];
        if (!rows.length) {
            return { success: false, error: { code: 'INVALID_ITEMS', message: 'cart is empty' } };
        }
        const items = rows.map((r) => ({
            menu_item_id: r.itemId, size: r.size, quantity: r.qty,
        }));
        /* The cart is emptied BEFORE the request, not after it. A second click
           that arrives while this one is in flight therefore finds an empty cart
           instead of a duplicate. */
        const snapshot = cart;
        cart = new Map();
        const res = await createOrder(pendingName, items);
        if (res.success) {
            const d = res.data || {};
            /* code stays a string end-to-end; never Number() it. */
            orderResult = { code: String(d.claim_code ?? d.code ?? ''), name: pendingName };
        } else {
            cart = snapshot;   /* nothing was placed - put the order back to fix */
        }
        return res;
    }

    let pendingName = '';

    /* The name is read from the field above the cart at the moment Proceed to
       Checkout is tapped. A blank field is refused HERE, client-side, before any
       request is sent — an order can never be placed without a name, and the
       server's INVALID_CUSTOMER_NAME guard stays as the backstop. */
    /* Letters only. A digit or a symbol is refused here, client-side, before any
       request is sent — a customer cannot reach the counter as "12312312". Spaces
       and apostrophes/hyphens stay legal because they are real in names (Mary Ann,
       D'Angelo, Anne-Marie). One letter is not a name, so two letters minimum. */
    function setName(name) {
        const trimmed = String(name || '').trim();
        if (!trimmed) {
            pendingName = '';
            return { errorCopy: "We need your name at the counter." };
        }
        if (!/^[\p{L}][\p{L} '\-]*$/u.test(trimmed)) {
            pendingName = '';
            return { errorCopy: "Names use letters only — no numbers or symbols." };
        }
        if ([...trimmed].filter((c) => /\p{L}/u.test(c)).length < 2) {
            pendingName = '';
            return { errorCopy: "Please give at least two letters — one letter is not enough." };
        }
        if (trimmed.length > 100) return { errorCopy: "That name is too long — keep it under 100 characters." };
        pendingName = trimmed;
        return null;
    }

    /* --- event wiring (delegated, so re-rendering cards keeps handlers) -- */
    /* Card-level stepper: the clamp at 1 is deliberate. This stepper sets the
       quantity for the NEXT "Add to Cart"; undoing something already in the cart
       is a cart-line action (setCartQty / Remove). Do not allow 0 here. */
    function setQty(itemId, delta) {
        const cur = currentQty(itemId);
        const next = Math.min(999, Math.max(1, cur + delta));
        setQtyDisplay(itemId, next);
    }
    /* Cart-level quantity: dropping below 1 DELETES the line. This is the only
       path by which a customer can remove an item they already added. */
    function setCartQty(key, delta) {
        const row = cart.get(key);
        if (!row) return;
        const next = row.qty + delta;
        if (next < 1) cart.delete(key);
        else row.qty = Math.min(999, next);
        paint();
    }
    function currentQty(itemId) {
        const el = document.querySelector(`[data-item="${CSS.escape(itemId)}"] [data-qty-display]`);
        return el ? parseInt(el.textContent, 10) || 1 : 1;
    }
    function setQtyDisplay(itemId, n) {
        const el = document.querySelector(`[data-item="${CSS.escape(itemId)}"] [data-qty-display]`);
        if (el) el.textContent = String(n);
    }
    function addToCart(itemId) {
        const item = menu.find((m) => m.id === itemId);
        if (!item) return;
        const card = document.querySelector(`[data-item="${CSS.escape(itemId)}"]`);
        /* sizeChoice is the truth (it survives repaints); the card attribute is
           a fallback only, and the first offered size is the rendered default. */
        const size = sizeChoice.get(itemId) ?? card?.dataset.size
            ?? (item.sizes_and_prices?.[0]?.size ?? '');
        const qty = currentQty(itemId);
        const k = keyOf(itemId, size);
        const existing = cart.get(k);
        if (existing) existing.qty = Math.min(999, existing.qty + qty);
        else cart.set(k, { itemId, size, qty });
    }

    document.addEventListener('click', (e) => {
        const t = e.target;
        if (t.dataset.cat) { activeCat = t.dataset.cat; paint(); }
        else if (t.dataset.qty) {
            const card = t.closest('[data-item]');
            if (card) setQty(card.dataset.item, Number(t.dataset.qty));
        }
        else if (t.dataset.add !== undefined) {
            const card = t.closest('[data-item]');
            if (card) { addToCart(card.dataset.item); paint(); }
        }
        /* Cart-line controls. These use data-cart-qty / data-cart-remove, never
           data-qty: that hook is card-scoped and resolved through
           closest('[data-item]'), which a cart row is not inside. */
        else if (t.dataset.cartQty !== undefined) {
            const row = t.closest('[data-cart-line]');
            if (row?.dataset.cartId) {
                setCartQty(keyOf(row.dataset.cartId, row.dataset.cartSize), Number(t.dataset.cartQty));
            }
        }
        else if (t.dataset.cartRemove !== undefined) {
            const row = t.closest('[data-cart-line]');
            if (row?.dataset.cartId) { cart.delete(keyOf(row.dataset.cartId, row.dataset.cartSize)); paint(); }
        }
        else if (t.dataset.size) {
            /* Selection lives in sizeChoice, not on the card: paint() below
               replaces #app's innerHTML, which would destroy a data-size on the
               card. A different size is still a separate cart line (key = id +
               NUL + size), so switching sizes does not merge the two lines. */
            const card = t.closest('[data-item]');
            if (card) {
                sizeChoice.set(card.dataset.item, t.dataset.size);
                card.dataset.size = t.dataset.size;
                paint();          /* the tap must be visible, not silent */
            }
        }
        else if (t.dataset.checkout !== undefined) {
            /* Proceed to Checkout IS the place-order action — there is no second
               "Place Order" button to tap. It reads the name field above the
               cart, refuses a blank one with a human line, and only sends when
               the name is real. */
            const input = document.querySelector('[data-name-input]');
            const bad = setName(input ? input.value : '');
            if (bad) { paintNameCopy(bad.errorCopy); } else { void runCheckout(); }
        }
    });

    function paint() {
        if (orderResult) {
            document.getElementById('app').innerHTML = renderSuccess();
            document.getElementById('cartarea').innerHTML = '';
            return;
        }
        document.getElementById('app').innerHTML = renderMenu();
        document.getElementById('cartarea').innerHTML = renderCart();
    }

    async function runCheckout() {
        /* A double tap is a mis-tap, not a second order: the first tap already
           owns the request, so the second is swallowed in silence - an error
           card for a tap the customer never meant would only frighten them. */
        if (placing) return;
        placing = true;
        const res = await checkout();
        placing = false;
        if (res.success) {
            document.getElementById('namefield').innerHTML = '';
        }
        paint();
        if (!res.success) paintError(res);
    }
    function paintError(res) {
        /* Keep the cart visible when the customer can fix it by adjusting the
           cart (an item went away, a size changed) — they should not have to
           rebuild their order from memory. */
        const fixable = res.error?.code === 'MENU_ITEM_UNAVAILABLE'
            || res.error?.code === 'INVALID_SIZE';
        document.getElementById('app').innerHTML = renderError(res);
        document.getElementById('cartarea').innerHTML = fixable ? renderCart() : '';
    }

    /* --- name input: inline, trimmed, 1–100 chars ------------------------ */
    /* No submit button here. The field sits above the cart and the single
       action button is "Proceed to Checkout" at the foot of the cart, so typing
       must never fire a request on its own — the customer taps the button once
       the whole order is right. */
    function openNameInput() {
        document.getElementById('namefield').innerHTML = nameFieldHtml('');
    }

    /* One builder, two states: quiet, or carrying a refusal line. The refusal
       must stay VISIBLE next to the field — the old code swapped the field for
       the copy and then re-rendered the field immediately, so the message never
       survived a frame and a blank tap looked like nothing happened. */
    function nameFieldHtml(complaint) {
        return `<div class="glass-card rounded-xl p-4">
               ${complaint ? `<p class="text-brand-accentLight text-sm font-semibold mb-2">${esc(complaint)}</p>` : ''}
               <label class="text-brand-muted text-xs uppercase tracking-wider">Full name at the counter</label>
               <input type="text" placeholder="e.g. Maria Santos"
                      class="rounded-md p-2 text-brand-cream bg-brand-card/60 border border-brand-border mt-2 w-full"
                      data-name-input>
               <p class="text-brand-muted text-xs mt-1">Type your name, then tap Proceed to Checkout at the foot of your cart.</p>
             </div>`;
    }

    /* Refusal: keep the field, add the line above it, so the customer can fix
       it and tap again. Nothing was sent — the cart is untouched. */
    function paintNameCopy(copy) {
        document.getElementById('namefield').innerHTML = nameFieldHtml(copy);
    }

    /* --- boot ------------------------------------------------------------ */
    (async function () {
        const loadErr = await loadCatalogue();
        if (loadErr) {
            paintError(loadErr);
            return;
        }
        paint();
        openNameInput();
    })();
    </script>
</body>
</html>
